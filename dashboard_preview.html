<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QuantBet Football Dashboard</title>
  <style>
    body{margin:0;background:#07111f;color:#eef5ff;font:16px system-ui;padding:30px}
    .box{max-width:1100px;margin:auto;background:#0d1a2b;border:1px solid #20344e;border-radius:24px;padding:28px}
    .card{background:#101f33;border:1px solid #20344e;border-radius:16px;padding:18px}
    h1{font-size:34px;margin:0}.muted{color:#8fa5bf}.gold{color:#f5c86b}
  </style>
</head>
<body>
  <div class="box">
    <p class="muted">QUANTBET INTELLIGENCE</p>
    <h1>Football Command Center</h1>
    <p class="muted">⚽ Football — PRODUCTION</p>
    <div class="card" style="margin-top:18px">
      <h2>Football</h2>
      <p>Value / OOS monitoring · settlement monitoring · timing research</p>
      <p class="muted">Production surface for Football only.</p>
    </div>
    <div class="card" style="margin-top:18px">
      <h2>Betting Track — <span class="gold">RSD</span></h2>
      <p>Profit / Loss · Total Staked · ROI · Completed Bets</p>
      <p class="muted">All monetary figures are RSD.</p>
    </div>
  </div>
</body>
</html>
