name: Apply global quota governor
on:
  push:
    branches: [fix/78-global-quota-governor]

jobs:
  patch:
    if: github.actor == 'Filip1994'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch API client
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/quantbot/api.py')
          s = p.read_text()
          s = s.replace('from .config import Settings\n', 'from .config import Settings\nfrom .quota import GlobalQuotaExceeded, GlobalQuotaGovernor\n', 1)
          needle = '        self.settings.root.joinpath("data", "raw_api").mkdir(\n            parents=True, exist_ok=True\n        )\n'
          repl = needle + '        self.quota = GlobalQuotaGovernor(\n            self.settings.root / "data" / "football_api_quota.json",\n            self.settings.api_request_budget,\n            self.settings.api_budget_reserve,\n        )\n'
          if 'self.quota = GlobalQuotaGovernor(' not in s:
              s = s.replace(needle, repl, 1)
          old = '''            request = Request(\n                url,\n                headers={\n                    "x-apisports-key": self.settings.api_key,\n                    "Accept": "application/json",\n                },\n                method="GET",\n            )\n            self.request_count += 1\n            self.endpoint_requests[endpoint] += 1\n            try:\n'''
          new = '''            workflow = os.getenv("GITHUB_WORKFLOW") or os.getenv("GITHUB_JOB") or "local"\n            try:\n                reservation_id = self.quota.reserve(workflow, endpoint, "GET", protected=reserve_protected)\n            except GlobalQuotaExceeded as exc:\n                self.budget_exhaustion_events += 1\n                raise APIBudgetExceeded(str(exc)) from exc\n            request = Request(\n                url,\n                headers={\n                    "x-apisports-key": self.settings.api_key,\n                    "Accept": "application/json",\n                },\n                method="GET",\n            )\n            self.request_count += 1\n            self.endpoint_requests[endpoint] += 1\n            try:\n'''
          if old not in s:
              raise SystemExit('request block not found')
          s = s.replace(old, new, 1)
          old = '''                with urlopen(request, timeout=20) as response:\n                    raw = response.read().decode("utf-8")\n                break\n'''
          new = '''                with urlopen(request, timeout=20) as response:\n                    raw = response.read().decode("utf-8")\n                self.quota.consume(reservation_id)\n                break\n'''
          s = s.replace(old, new, 1)
          old = '''            except HTTPError as exc:\n                self.http_errors[str(exc.code)] += 1\n'''
          new = '''            except HTTPError as exc:\n                self.quota.consume(reservation_id)\n                self.http_errors[str(exc.code)] += 1\n'''
          s = s.replace(old, new, 1)
          old = '''            except (URLError, TimeoutError) as exc:\n                self.network_error_events += 1\n'''
          new = '''            except (URLError, TimeoutError) as exc:\n                self.quota.consume(reservation_id)\n                self.network_error_events += 1\n'''
          s = s.replace(old, new, 1)
          old = '            "endpoint_cache_hits": dict(sorted(self.endpoint_cache_hits.items())),\n'
          new = old + '            "global_quota": self.quota.snapshot(),\n'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/apply-78-api.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/quantbot/api.py src/quantbot/quota.py .github/workflows/apply-78-api.yml
          git commit -m 'feat: enforce global Football API quota governance'
          git push
