name: QuantBet H2H research telemetry

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Daily QuantBet bulletin
      - QuantBet intraday strong-signal scanner
      - QuantBet adaptive watchlist monitor
      - Monitor odds and settle ledgers
      - QuantBet T-5 closing odds capture
    types: [completed]

permissions:
  contents: write

concurrency:
  group: quantbet-ledger
  cancel-in-progress: false

jobs:
  persist:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      PAPER_MODE: ${{ vars.PAPER_MODE || 'true' }}
      H2H_TELEMETRY_ENABLED: ${{ vars.H2H_TELEMETRY_ENABLED || 'false' }}
      API_REQUEST_BUDGET: ${{ vars.API_REQUEST_BUDGET || '7500' }}
      API_BUDGET_RESERVE: ${{ vars.API_BUDGET_RESERVE || '500' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: python tools/persist_h2h.py
      - run: python tools/h2h_telemetry_health.py
      - name: Commit H2H research telemetry
        run: |
          set -euo pipefail
          if git diff --quiet -- intraday_alerts.json && test -z "$(git status --porcelain -- data/h2h_snapshots.jsonl data/h2h_outcomes.jsonl)"; then
            echo "No H2H telemetry changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intraday_alerts.json data/h2h_snapshots.jsonl data/h2h_outcomes.jsonl
          git commit -m "Persist QuantBet H2H research telemetry"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 2; }
          done
          echo "Unable to push after retries" >&2
          exit 1
