name: Temporary · current repo backup

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Create full repository backup
        run: |
          set -euo pipefail
          git archive --format=zip --output=QuantBet-main-backup-${GITHUB_SHA}.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: QuantBet-main-backup-${{ github.sha }}
          path: QuantBet-main-backup-${{ github.sha }}.zip
          retention-days: 90
