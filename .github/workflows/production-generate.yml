name: Production · daily picks

on:
  workflow_dispatch:
  schedule:
    - cron: "11 0 * * *"
      timezone: "Europe/Belgrade"

permissions:
  contents: write

concurrency:
  group: quantbet-football-api-global
  cancel-in-progress: false

env:
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  GMAIL_USER: ${{ secrets.GMAIL_USER }}
  GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
  EMAIL_TO: ${{ secrets.EMAIL_TO }}
  PAPER_MODE: ${{ vars.PAPER_MODE || 'true' }}
  INITIAL_BANK_RSD: '30000'
  API_REQUEST_BUDGET: ${{ vars.API_REQUEST_BUDGET || '7500' }}
  API_BUDGET_RESERVE: ${{ vars.API_BUDGET_RESERVE || '500' }}
  TIMEZONE: Europe/Belgrade

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate active Production picks
        run: python tools/validate_production_picks.py
      - name: Generate Production picks and email
        run: python main.py generate
      - name: Build the human-readable Production view
        run: python tools/build_production_view.py
      - name: Archive raw API evidence to Railway Bucket
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RAILWAY_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RAILWAY_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.RAILWAY_S3_REGION }}
          S3_ENDPOINT: ${{ secrets.RAILWAY_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.RAILWAY_S3_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$AWS_DEFAULT_REGION"
          test -n "$S3_ENDPOINT"
          test -n "$S3_BUCKET"
          src="data/raw_api/$(date -u +%F).jsonl"
          if [ ! -f "$src" ]; then
            echo 'No raw API archive produced by this run'
            exit 0
          fi
          base="$(basename "$src" .jsonl)"
          gzip -c "$src" > "/tmp/${base}.jsonl.gz"
          sha="$(sha256sum "$src" | awk '{print $1}')"
          aws s3 cp "/tmp/${base}.jsonl.gz" "s3://${S3_BUCKET}/quantumbet/raw-api/live/${base}.jsonl.gz" \
            --endpoint-url "$S3_ENDPOINT" \
            --region "$AWS_DEFAULT_REGION" \
            --metadata "sha256=${sha}" \
            --no-progress
          rm -f "/tmp/${base}.jsonl.gz"
          echo 'Raw API archive upload: PASS'
      - name: Commit Production state
        run: |
          set -euo pipefail
          files=(bets.json predictions.json ledger_meta.json api_usage.json api_usage_history.json generation_health.json generation_health_history.json production_dashboard.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --ignore-errors "${files[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run daily Production picks"
          git push
