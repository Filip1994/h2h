name: Weekly QuantBet research report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 0"
      timezone: "Europe/Belgrade"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build weekly research summary
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime, timedelta
          from pathlib import Path
          import sys
          sys.path.insert(0, "src")
          from quantbot.config import Settings
          from quantbot.reporting import send_email

          root = Path.cwd()
          settings = Settings.from_env(root)
          now = datetime.now(UTC)
          cutoff = now - timedelta(days=7)
          history = []
          path = settings.api_usage_history_file
          if path.exists():
              loaded = json.loads(path.read_text(encoding="utf-8"))
              if isinstance(loaded, list):
                  history = [x for x in loaded if x.get("timestamp", "") >= cutoff.isoformat()]

          total_requests = sum(int(x.get("request_count", 0)) for x in history)
          total_bets = sum(int(x.get("new_bets", 0)) for x in history)
          total_budget = settings.api_request_budget * max(1, len(history))
          cache_hits = sum(int(x.get("cache_hits", 0)) for x in history)
          cache_misses = sum(int(x.get("cache_misses", 0)) for x in history)
          hit_rate = cache_hits / max(1, cache_hits + cache_misses)
          endpoint_totals = {}
          for item in history:
              for endpoint, count in item.get("endpoint_requests", {}).items():
                  endpoint_totals[endpoint] = endpoint_totals.get(endpoint, 0) + int(count)
          top = sorted(endpoint_totals.items(), key=lambda pair: pair[1], reverse=True)[:8]

          rows = "".join(f"<tr><td>{endpoint}</td><td>{count}</td></tr>" for endpoint, count in top)
          html = f"""
          <html><body>
          <h2>QuantBet — weekly research report</h2>
          <p>Period: {cutoff.date()} → {now.date()}</p>
          <ul>
            <li>API requests: <b>{total_requests}</b> / {total_budget} budget units</li>
            <li>New paper bets: <b>{total_bets}</b></li>
            <li>Cache hit rate: <b>{hit_rate:.1%}</b></li>
            <li>Runs recorded: <b>{len(history)}</b></li>
          </ul>
          <h3>API consumption by endpoint</h3>
          <table border="1" cellpadding="5"><tr><th>Endpoint</th><th>Requests</th></tr>{rows}</table>
          <p>Purpose: identify where API budget creates useful information and where calls can be reduced or redirected.</p>
          </body></html>
          """
          subject = f"QuantBet weekly research — API usage {now.date()}"
          send_email(subject, html, settings)
          PY
