name: H2H Multi-Key Scanner & Tracker

on:
  schedule:
    - cron: '0 7 * * *'    # 09:00 CEST (Jutarnji bilten)
    - cron: '30 21 * * *'  # 23:30 CEST (Večernji CLV i rezultati)
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instaliraj biblioteke
        run: pip install requests

      # AKO JE OTVOREN ISSUE ZA PRESKAKANJE
      - name: Preskoči Tip
        if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'SKIP_')
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          BET_ID=$(echo "${{ github.event.issue.title }}" | sed 's/SKIP_//')
          python main.py skip $BET_ID

      # JUTARNJI BILTEN (Telegram)
      - name: Pokreni Jutarnji Bilten
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 7 * * *')
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python master_runner.py

      # VEČERNJA PROVERA I CLV
      - name: Pokreni Večernju Proveru
        if: github.event_name == 'schedule' && github.event.schedule == '30 21 * * *'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python main.py evening

      - name: Sačuvaj bazu (Auto Commit)
        run: |
          git config --global user.name "H2H Tracker Bot"
          git config --global user.email "bot@github.com"
          git add bets.json
          git commit -m "Auto update bets.json [skip ci]" || exit 0
          git push
