name: H2H Multi-Key Scanner & Tracker

on:
  schedule:
    - cron: '0 7 * * *'    # Svakog dana u 09:00 CEST (07:00 UTC)
    - cron: '30 21 * * *'  # Svakog dana u 23:30 CEST (21:30 UTC)
  workflow_dispatch:
  repository_dispatch:
    types: [skip_bet]

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instaliraj biblioteke
        run: pip install requests

      # POKREĆE SE KADA KLIKNEŠ "PRESKOČI TIP" U MEJLU OVER GOOGLE WEBHOOKA
      - name: Izvrši Preskakanje Tipa
        if: github.event_name == 'repository_dispatch'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python main.py skip ${{ github.event.client_payload.bet_id }}

      # REDOVNO JUTARNJE SKENIRANJE
      - name: Pokreni Master Jutarnji Bilten
        if: github.event.schedule == '0 7 * * *' || github.event_name == 'workflow_dispatch'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python master_runner.py

      # VEČERNJE PORAVNANJE REZULTATA
      - name: Pokreni Večernju Proveru Rezultata
        if: github.event.schedule == '30 21 * * *'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python main.py evening

      - name: Sačuvaj bazu opklada na GitHub (Auto Commit)
        run: |
          git config --global user.name "H2H Tracker Bot"
          git config --global user.email "bot@github.com"
          git add bets.json
          git commit -m "Auto update bets.json [skip ci]" || exit 0
          git push
