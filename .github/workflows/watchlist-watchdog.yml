name: QuantBet watchlist freshness watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check canonical scanner freshness
        id: freshness
        continue-on-error: true
        run: python tools/watchlist_freshness_gate.py
      - name: Self-heal stale scanner
        if: steps.freshness.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watchlist.yml --ref "${{ github.event.repository.default_branch }}"
