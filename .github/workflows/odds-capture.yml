name: QuantBet exhaustive odds capture

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"
      timezone: "Europe/Belgrade"

permissions:
  contents: write

concurrency:
  group: quantbet-football-api-global
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      PAPER_MODE: ${{ vars.PAPER_MODE || 'true' }}
      API_REQUEST_BUDGET: ${{ vars.API_REQUEST_BUDGET || '7500' }}
      API_BUDGET_RESERVE: ${{ vars.API_BUDGET_RESERVE || '500' }}
      TIMEZONE: Europe/Belgrade
      QUANTBOT_ELIGIBILITY_LEDGER: data/eligibility_coverage.jsonl
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/api
          key: odds-capture-api-${{ runner.os }}-${{ github.run_id }}
          restore-keys: odds-capture-api-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - name: Capture complete eligible Football universe
        run: python main.py capture-odds
      - name: Audit production operations gate
        run: python tools/audit_production_operations.py
      - name: Commit immutable observations, coverage state and operations evidence
        run: |
          set -euo pipefail
          files=(odds_collection_budget.json odds_collection_state.json odds_collection_metrics.json production_operations_gate.md data/odds_snapshots.jsonl data/odds_collection_coverage.jsonl data/eligibility_coverage.jsonl)
          changed=0
          for file in "${files[@]}"; do
            if [ -e "$file" ] && ! git diff --quiet -- "$file"; then changed=1; fi
            if [ -e "$file" ] && ! git ls-files --error-unmatch "$file" >/dev/null 2>&1; then changed=1; fi
          done
          if [ "$changed" -eq 0 ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --ignore-errors "${files[@]}"
          git commit -m "Capture exhaustive Football odds observations"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Odds collection reconciliation conflict; capture update failed." >&2
              exit 1
            fi
          done
          echo "Unable to push after retries" >&2
          exit 1
