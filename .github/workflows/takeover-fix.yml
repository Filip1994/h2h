name: Takeover patch

on:
  push:
    branches:
      - feat/h2h-research-dataset-v1b2

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Takeover automation patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply telemetry linkage patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/quantbot/engine.py')
          s = p.read_text()
          needle = '                        calibration_status=calibration_status,\n                    )'
          replacement = '                        calibration_status=calibration_status,\n                        h2h_enabled=self.settings.h2h_telemetry_enabled,\n                    )'
          assert needle in s
          p.write_text(s.replace(needle, replacement, 1))

          p = Path('src/quantbot/watchlist.py')
          s = p.read_text()
          needle = '        "stake": round(float(linked_bet.get("stake") if linked_bet else stake), 2),\n        "signal_source": "INTRADAY_ALERT",'
          replacement = '''        "stake": round(float(linked_bet.get("stake") if linked_bet else stake), 2),
        "signal_id": event_id,
        "h2h_enabled": prediction.get("h2h_enabled"),
        "h2h_available": prediction.get("h2h_available"),
        "h2h_status": prediction.get("h2h_status"),
        "h2h_error": prediction.get("h2h_error"),
        "h2h_snapshot_id": prediction.get("h2h_snapshot_id"),
        "h2h_rate": prediction.get("h2h_rate"),
        "h2h_n": prediction.get("h2h_n"),
        "h2h_effective_n": prediction.get("h2h_effective_n"),
        "h2h_history": prediction.get("h2h_history", []),
        "signal_source": "INTRADAY_ALERT",'''
          assert needle in s
          p.write_text(s.replace(needle, replacement, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/quantbot/engine.py src/quantbot/watchlist.py
          git commit -m 'Takeover automation patch'
          git push
