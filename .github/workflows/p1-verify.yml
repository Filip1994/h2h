name: P1 H2H verification final
on:
  push:
    branches: [p1/h2h-removal-final3]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: p1/h2h-removal-final3}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q src main.py backtest.py tests
      - name: Test suite
        run: pytest -q
      - name: Final executable H2H scan
        run: |
          python - <<'PY'
          from pathlib import Path
          pats=['head_to_head','fixtures/headtohead','h2h_telemetry_enabled','quantbot.h2h','h2h_rate','h2h_effective_n','h2h_history','h2h_snapshot_id','h2h_eligible']
          bad=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or 'data' in p.parts or p.as_posix() in {'.github/workflows/p1-verify.yml','.github/workflows/p1-final-scan.yml'}: continue
              if p.suffix.lower() not in {'.py','.yml','.yaml','.toml','.env','.example','.html'}: continue
              t=p.read_text(encoding='utf-8',errors='ignore')
              hits=[x for x in pats if x.lower() in t.lower()]
              if hits: bad.append((p.as_posix(),hits))
          if bad: print(bad); raise SystemExit(1)
          print('No executable H2H production references.')
          PY
