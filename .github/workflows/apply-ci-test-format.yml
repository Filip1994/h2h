name: Apply CI test formatting

on:
  push:
    branches:
      - fix/ci-contracts-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ci-contracts-v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.6
      - name: Format and lint
        run: |
          ruff format .
          ruff check . --fix
      - name: Remove formatter workflow
        run: rm .github/workflows/apply-ci-test-format.yml
      - name: Commit formatting
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: format CI contract tests"
          git push
