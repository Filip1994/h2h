name: API-Football bookmaker inventory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantbet-bookmaker-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_BASE_URL: ${{ vars.API_FOOTBALL_BASE_URL || 'https://v3.football.api-sports.io' }}
      API_REQUEST_BUDGET: ${{ vars.API_REQUEST_BUDGET || '7500' }}
      API_BUDGET_RESERVE: ${{ vars.API_BUDGET_RESERVE || '500' }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - name: Generate complete bookmaker catalogue report
        run: python tools/bookmaker_inventory.py --output-dir diagnostics/bookmakers
      - name: Email report when delivery is configured
        if: ${{ env.GMAIL_USER != '' && env.GMAIL_APP_PASS != '' && env.EMAIL_TO != '' }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage
          from pathlib import Path

          msg = EmailMessage()
          msg["Subject"] = "QuantBet API-Football bookmaker inventory"
          msg["From"] = os.environ["GMAIL_USER"]
          msg["To"] = os.environ["EMAIL_TO"]
          msg.set_content(
              "Attached is the one-time API-Football bookmaker inventory. "
              "The JSON is the source-of-truth report; CSV is for inspection."
          )
          for name in ("bookmaker_inventory.json", "bookmaker_inventory.csv"):
              path = Path("diagnostics/bookmakers") / name
              msg.add_attachment(
                  path.read_bytes(),
                  maintype="application",
                  subtype="json" if path.suffix == ".json" else "csv",
                  filename=name,
              )
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(os.environ["GMAIL_USER"], os.environ["GMAIL_APP_PASS"])
              smtp.send_message(msg)
          print(f"Bookmaker report emailed to {os.environ['EMAIL_TO']}")
          PY
      - name: Upload bookmaker inventory artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bookmaker-inventory
          path: diagnostics/bookmakers/
          if-no-files-found: error
          retention-days: 30
      - name: Print artifact paths and summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("diagnostics/bookmakers/bookmaker_inventory.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          print(f"JSON artifact: {path}")
          print("CSV artifact: diagnostics/bookmakers/bookmaker_inventory.csv")
          print(f"Catalogue count: {report['catalogue']['count']}")
          print(f"Fixture /odds observed count: {report['fixture_odds_observed']['count']}")
          print("No geography/licensing/production bookmaker filter was applied.")
          PY
