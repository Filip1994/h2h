name: Apply multi-market engine fix retry
on:
  push:
    branches: [fix/81-multi-market-persistence-v2]

jobs:
  patch:
    if: github.actor == 'Filip1994'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch engine robustly
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/quantbot/engine.py')
          s = p.read_text()
          if 'blocked_market_keys = self.bet_store.blocked_market_keys(existing_bets)' not in s:
              s, n = re.subn(
                  r'        blocked_fixture_ids = self\.bet_store\.blocked_fixture_ids\(existing_bets\)\n',
                  '        blocked_market_keys = self.bet_store.blocked_market_keys(existing_bets)\n'
                  '        blocked_fixture_ids = {\n'
                  '            fixture_id for fixture_id, market in blocked_market_keys if market is None\n'
                  '        }\n',
                  s, count=1)
              if n != 1:
                  raise SystemExit('could not patch blocked market assignment')
          pattern = r'            if fixture_id in blocked_fixture_ids or fields\["status"\] not in \{\n                "NS",\n                "TBD",\n            \}:\n'
          s, n = re.subn(pattern, '            if fields["status"] not in {"NS", "TBD"}:\n', s, count=1)
          if n != 1 and 'if fields["status"] not in {"NS", "TBD"}:' not in s:
              raise SystemExit('could not patch fixture blocking condition')
          p.write_text(s)
          PY
          rm .github/workflows/apply-multi-market-v2.yml .github/workflows/apply-multi-market-v2b.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/quantbot/engine.py .github/workflows/apply-multi-market-v2.yml .github/workflows/apply-multi-market-v2b.yml
          git commit -m 'fix: allow multiple production markets per fixture'
          git push
