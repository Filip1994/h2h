name: Production · settlement

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: quantbet-football-api-global
  cancel-in-progress: false

env:
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  PAPER_MODE: ${{ vars.PAPER_MODE || 'true' }}
  API_REQUEST_BUDGET: '7500'
  API_BUDGET_RESERVE: '0'
  TIMEZONE: UTC

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/api
          key: production-settlement-api-${{ runner.os }}-${{ github.run_id }}
          restore-keys: production-settlement-api-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - name: Settle finished Production bets
        run: python main.py monitor
      - name: Rebuild Production dashboard data
        run: python tools/build_production_view.py
      - name: Commit settlement state
        run: |
          set -euo pipefail
          files=(bets.json predictions.json production_dashboard.json api_usage.json api_usage_history.json data/football_api_quota.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --ignore-errors "${files[@]}"
          git add data/raw_api 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Settle Production bets"
          git push
