name: Apply multi-market storage patch

on:
  push:
    branches: [fix/81-multi-market-persistence]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Remove fixture-level blocking from generation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/quantbot/engine.py')
          s = p.read_text()
          old = '''        blocked_fixture_ids = self.bet_store.blocked_fixture_ids(existing_bets)\n'''
          new = '''        blocked_market_keys = self.bet_store.blocked_market_keys(existing_bets)\n        blocked_fixture_ids = {\n            fixture_id for fixture_id, market in blocked_market_keys if market is None\n        }\n'''
          if old not in s:
              raise SystemExit('blocked fixture assignment not found')
          s = s.replace(old, new, 1)
          old = '''            if fixture_id in blocked_fixture_ids or fields["status"] not in {\n                "NS",\n                "TBD",\n            }:\n'''
          new = '''            if fields["status"] not in {"NS", "TBD"}:\n'''
          if old not in s:
              raise SystemExit('fixture status gate not found')
          s = s.replace(old, new, 1)
          old = '''            fixture_candidates: list[MarketCandidate] = []\n'''
          new = '''            fixture_candidates: list[MarketCandidate] = []\n'''
          p.write_text(s)
          PY
      - name: Remove patch workflow
        run: rm .github/workflows/apply-multi-market-storage.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/quantbot/engine.py .github/workflows/apply-multi-market-storage.yml
          git commit -m 'Allow multiple qualifying markets per fixture'
          git push
