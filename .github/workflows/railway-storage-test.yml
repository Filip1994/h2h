name: Railway · storage connectivity test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check AWS CLI
        run: aws --version

      - name: Create deterministic test object
        shell: bash
        run: |
          set -euo pipefail
          printf 'QuantumBet Railway storage test\nrun=%s\n' "$GITHUB_RUN_ID" > railway-storage-test.txt
          sha256sum railway-storage-test.txt | tee railway-storage-test.sha256

      - name: Upload test object to Railway Bucket
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RAILWAY_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RAILWAY_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.RAILWAY_S3_REGION }}
          ENDPOINT: ${{ secrets.RAILWAY_S3_ENDPOINT }}
          BUCKET: ${{ secrets.RAILWAY_S3_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp railway-storage-test.txt "s3://${BUCKET}/_connectivity-test/railway-storage-test-${GITHUB_RUN_ID}.txt" \
            --endpoint-url "$ENDPOINT" \
            --region "$AWS_DEFAULT_REGION"

      - name: Read back and verify checksum
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RAILWAY_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RAILWAY_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.RAILWAY_S3_REGION }}
          ENDPOINT: ${{ secrets.RAILWAY_S3_ENDPOINT }}
          BUCKET: ${{ secrets.RAILWAY_S3_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp "s3://${BUCKET}/_connectivity-test/railway-storage-test-${GITHUB_RUN_ID}.txt" railway-storage-test-downloaded.txt \
            --endpoint-url "$ENDPOINT" \
            --region "$AWS_DEFAULT_REGION"
          sha256sum -c railway-storage-test.sha256 --ignore-missing
          cmp railway-storage-test.txt railway-storage-test-downloaded.txt
          echo 'Railway Bucket write/read/checksum verification: PASS'

      - name: Delete test object
        if: always()
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RAILWAY_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RAILWAY_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.RAILWAY_S3_REGION }}
          ENDPOINT: ${{ secrets.RAILWAY_S3_ENDPOINT }}
          BUCKET: ${{ secrets.RAILWAY_S3_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 rm "s3://${BUCKET}/_connectivity-test/railway-storage-test-${GITHUB_RUN_ID}.txt" \
            --endpoint-url "$ENDPOINT" \
            --region "$AWS_DEFAULT_REGION"
