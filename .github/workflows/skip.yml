name: Skip pending bet

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: quantbet-football-api-global
  cancel-in-progress: false

jobs:
  skip:
    if: >-
      startsWith(github.event.issue.title, 'SKIP_') &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    env:
      ISSUE_TITLE: ${{ github.event.issue.title }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py skip --issue-title "$ISSUE_TITLE"
      - name: Validate canonical system state before commit
        run: python tools/system_health.py --stale-minutes 30
      - name: Commit SKIPPED state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bets.json system_health.json
          git commit -m "Skip pending QuantBet tip"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1
      - run: gh issue close "${{ github.event.issue.number }}" --comment "Tip je prebačen u SKIPPED status."
