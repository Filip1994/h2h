name: Skip pending Production bet

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: quantbet-skip
  cancel-in-progress: false

jobs:
  skip:
    if: >-
      startsWith(github.event.issue.title, 'SKIP_') &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    env:
      ISSUE_TITLE: ${{ github.event.issue.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply SKIPPED state
        run: python main.py skip --issue-title "$ISSUE_TITLE"
      - name: Commit SKIPPED state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bets.json
          if git diff --cached --quiet; then
            echo "No state change required."
            exit 0
          fi
          git commit -m "Skip pending QuantBet tip"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
      - name: Close skip request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --comment "Tip je prebačen u SKIPPED status."