name: Temporary · pre-reset backup

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: backup/pre-production-reset-2026-09-10
          fetch-depth: 0
      - name: Create pre-reset repository backup
        run: git archive --format=zip --output=QuantBet-pre-reset-backup-2026-09-10.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: QuantBet-pre-reset-backup-2026-09-10
          path: QuantBet-pre-reset-backup-2026-09-10.zip
          retention-days: 90
