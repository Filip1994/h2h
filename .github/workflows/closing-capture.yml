name: QuantBet T-5 closing odds capture

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: quantbet-closing
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      PAPER_MODE: ${{ vars.PAPER_MODE || 'true' }}
      API_REQUEST_BUDGET: ${{ vars.API_REQUEST_BUDGET || '7500' }}
      API_BUDGET_RESERVE: ${{ vars.API_BUDGET_RESERVE || '500' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/api
          key: api-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: api-cache-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - run: python main.py capture-closing
      - run: python tools/capture_alert_closing.py
      - name: Recover missed pre-kickoff closes from immutable observations
        run: python tools/recover_missing_closing.py
      - name: Build isolated public Strong Signal dataset
        run: python tools/build_public_signal_buckets.py
      - name: Normalize legacy Production contamination from virtual Strong Signals
        run: python tools/normalize_strong_virtual_state.py
      - name: Resolve Strong Signal Opening-Pick-Closing lifecycle
        run: python tools/enrich_public_strong_signal_lifecycle.py
      - name: Commit T-5 snapshots, recovered closes, isolated Strong Signals and raw API archive
        run: |
          set -euo pipefail
          files=(bets.json intraday_alerts.json strong_signal_ledger.json strong_signals.json strong_signals_portfolio.json near_misses.json)
          if git diff --quiet -- "${files[@]}" && test -z "$(git status --porcelain -- data/raw_api)"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}" data/raw_api
          git commit -m "Capture and recover QuantBet closing odds"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 2; }
          done
          echo "Unable to push after retries" >&2
          exit 1
