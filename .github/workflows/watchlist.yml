name: QuantBet adaptive watchlist monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 6-23 * * *"
      timezone: "Europe/Belgrade"

permissions:
  contents: write

concurrency:
  group: quantbet-ledger
  cancel-in-progress: false

jobs:
  watchlist:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      PAPER_MODE: ${{ vars.PAPER_MODE || 'true' }}
      H2H_TELEMETRY_ENABLED: ${{ vars.H2H_TELEMETRY_ENABLED || 'false' }}
      API_REQUEST_BUDGET: ${{ vars.API_REQUEST_BUDGET || '7500' }}
      API_BUDGET_RESERVE: ${{ vars.API_BUDGET_RESERVE || '500' }}
      INTRADAY_LOOKAHEAD_HOURS: "6"
      INTRADAY_ALERT_ENABLED: "true"
      STRONG_SIGNAL_MIN_EV: "0.10"
      STRONG_SIGNAL_MIN_EDGE_PP: "0.05"
      STRONG_SIGNAL_MIN_STAKE_RSD: "300"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/api
          key: api-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: api-cache-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - run: python main.py watchlist
      - name: Build public strong-signal dataset
        run: python tools/build_public_strong_signals.py
      - name: Commit watchlist, strong-signal state and raw API archive
        run: |
          set -euo pipefail
          if git diff --quiet -- intraday_watchlist_state.json intraday_alerts.json strong_signals.json && test -z "$(git status --porcelain -- data/raw_api)"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intraday_watchlist_state.json intraday_alerts.json strong_signals.json data/raw_api
          git commit -m "Update QuantBet watchlist and API archive"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 2; }
          done
          echo "Unable to push after retries" >&2
          exit 1
