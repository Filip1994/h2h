name: QuantBet adaptive watchlist monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: quantbet-watchlist
  cancel-in-progress: true

env:
  SIGNAL_WRITER_META: watchlist_run_meta.json

jobs:
  watchlist:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      PAPER_MODE: ${{ vars.PAPER_MODE || 'true' }}
      API_REQUEST_BUDGET: ${{ vars.API_REQUEST_BUDGET || '7500' }}
      API_BUDGET_RESERVE: ${{ vars.API_BUDGET_RESERVE || '500' }}
      INTRADAY_LOOKAHEAD_HOURS: "6"
      INTRADAY_ALERT_ENABLED: "true"
      STRONG_SIGNAL_MIN_EV: "0.10"
      STRONG_SIGNAL_MIN_EDGE_PP: "0.05"
      STRONG_SIGNAL_MIN_STAKE_RSD: "300"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/api
          key: api-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: api-cache-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - name: Run canonical Strong/Near scanner
        id: watchlist-run
        shell: bash
        run: |
          set -o pipefail
          python main.py watchlist | tee watchlist_run_output.json
      - name: Gate scanner fixture discovery and API activity
        run: python tools/watchlist_runtime_gate.py --run-output watchlist_run_output.json
      - name: Record scanner freshness heartbeat
        run: python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path
          payload = {
              "schema_version": 1,
              "checked_at": datetime.now(UTC).isoformat(),
              "workflow_run_id": "${{ github.run_id }}",
              "workflow_run_attempt": "${{ github.run_attempt }}",
          }
          Path("watchlist_freshness.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Build public Strong and Near Miss datasets
        run: python tools/build_public_signal_buckets.py
      - name: Rebuild canonical Near Miss lifecycle dataset
        run: python tools/finalize_near_miss_contract.py
      - name: Validate Strong Signal publication contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          ledger = json.loads(Path("strong_signal_ledger.json").read_text())
          public = json.loads(Path("strong_signals.json").read_text())
          portfolio = json.loads(Path("strong_signals_portfolio.json").read_text())

          ledger_rows = ledger.get("signals", ledger if isinstance(ledger, list) else [])
          public_rows = public.get("signals", public if isinstance(public, list) else [])
          assert isinstance(ledger_rows, list)
          assert isinstance(public_rows, list)
          assert isinstance(portfolio, dict)
          assert portfolio.get("initial_bankroll_rsd") == 10000
          assert portfolio.get("virtual_settled_only") is True
          strong_public = [r for r in public_rows if str(r.get("signal_class", "")).upper() == "STRONG_SIGNAL"]
          assert len(strong_public) <= len(ledger_rows)
          print(f"Strong publication contract OK: ledger={len(ledger_rows)} public_strong={len(strong_public)}")
          PY
      - name: Validate Near Miss lifecycle contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          rows = json.loads(Path("near_misses.json").read_text())
          assert isinstance(rows, list)
          required = {
              "id", "schema_version", "prediction_id", "fixture_id", "event_id", "market", "selection",
              "home_name", "away_name", "match", "league", "kickoff",
              "bookmaker_id", "bookmaker", "near_miss_reason", "status",
              "not_a_production_bet", "opening_odd", "opening_captured_at",
              "near_miss_odd", "near_miss_captured_at", "pick_odd",
              "pick_captured_at", "closing_odd", "closing_captured_at",
              "transition_history", "result", "settled_at", "settlement_type",
          }
          for row in rows:
              assert required <= set(row), f"Near Miss contract missing fields: {sorted(required - set(row))}"
              assert row["schema_version"] >= 3
              assert row["not_a_production_bet"] is True
              assert isinstance(row["transition_history"], list)
              kickoff_raw = row.get("kickoff")
              if kickoff_raw:
                  kickoff = datetime.fromisoformat(str(kickoff_raw).replace("Z", "+00:00"))
                  if kickoff.tzinfo is None:
                      kickoff = kickoff.replace(tzinfo=timezone.utc)
                  if datetime.now(timezone.utc) >= kickoff:
                      assert row["status"] != "PENDING", f"Stale Near Miss PENDING after kickoff: {row['id']}"
          print(f"Near Miss lifecycle contract OK: rows={len(rows)}")
          PY
      - name: Create canonical writer provenance marker
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW: ${{ github.workflow }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python tools/signal_writer_guard.py write \
            --path "${SIGNAL_WRITER_META}.pending" \
            --run-id "${RUN_ID}" \
            --run-attempt "${RUN_ATTEMPT}" \
            --workflow "${WORKFLOW}" \
            --sha "${SOURCE_SHA}"
      - name: Reject stale writer before publication
        run: |
          set -euo pipefail
          git fetch origin main
          if git cat-file -e "origin/main:${SIGNAL_WRITER_META}" 2>/dev/null; then
            git show "origin/main:${SIGNAL_WRITER_META}" > /tmp/current-watchlist-run-meta.json
          else
            : > /tmp/current-watchlist-run-meta.json
          fi
          python tools/signal_writer_guard.py check \
            --path "${SIGNAL_WRITER_META}.pending" \
            --current-path /tmp/current-watchlist-run-meta.json
          mv "${SIGNAL_WRITER_META}.pending" "${SIGNAL_WRITER_META}"
      - name: Commit watchlist, runtime health, freshness, signal history, provenance, quota and bounded API archive
        run: |
          set -euo pipefail
          files=(watchlist_run_output.json watchlist_runtime_health.json watchlist_freshness.json intraday_watchlist_state.json intraday_alerts.json strong_signal_ledger.json strong_signals.json strong_signals_portfolio.json near_misses.json market_timing_metrics.json "${SIGNAL_WRITER_META}")
          changed=0
          for file in "${files[@]}"; do
            if [ -e "$file" ] && ! git diff --quiet -- "$file"; then changed=1; fi
            if [ -e "$file" ] && git ls-files --error-unmatch "$file" >/dev/null 2>&1; then :; elif [ -e "$file" ]; then changed=1; fi
          done
          if git status --porcelain -- data/market_timing_snapshots.jsonl data/intraday_signal_events.jsonl data/raw_api | grep -q .; then changed=1; fi
          if [ "$changed" -eq 0 ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          while IFS= read -r file; do git add "$file"; done < <(find data/raw_api -type f -size -90M -print)
          git add data/market_timing_snapshots.jsonl data/intraday_signal_events.jsonl
          git commit -m "Update QuantBet signal classification observations"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            if git cat-file -e "origin/main:${SIGNAL_WRITER_META}" 2>/dev/null; then
              git show "origin/main:${SIGNAL_WRITER_META}" > /tmp/current-watchlist-run-meta.json
              if ! python tools/signal_writer_guard.py check \
                --path "${SIGNAL_WRITER_META}" \
                --current-path /tmp/current-watchlist-run-meta.json; then
                echo "Stale watchlist writer rejected after remote advanced." >&2
                exit 1
              fi
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Signal ledger reconciliation conflict; watchlist update failed." >&2
              exit 1
            fi
          done
          echo "Unable to push after retries" >&2
          exit 1
