name: Production · odds scheduler watchdog

on:
  schedule:
    # Offset from the collector schedule so the two schedulers are independent.
    - cron: "1/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check collector heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          runs=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production-odds.yml/runs?per_page=10")

          latest=$(printf '%s' "$runs" | python -c '
          import json,sys
          d=json.load(sys.stdin)
          rs=d.get("workflow_runs",[])
          if not rs:
              print("0")
              raise SystemExit
          # Prefer the newest run that has actually started/finished.
          for r in rs:
              if r.get("status") in {"queued","in_progress","completed"}:
                  print(r.get("created_at",""))
                  break
          else:
              print("0")
          ')

          if [ "$latest" = "0" ] || [ -z "$latest" ]; then
            age=999999
          else
            latest_epoch=$(date -d "$latest" +%s)
            age=$((now-latest_epoch))
          fi

          echo "Latest Production odds run: ${latest:-none}"
          echo "Collector heartbeat age: ${age}s"

          # Normal cadence is 5m. Give GitHub's scheduler an 8m grace period.
          # If it misses that window, explicitly dispatch the collector.
          if [ "$age" -gt 480 ]; then
            echo "Collector heartbeat stale; dispatching Production odds workflow."
            curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production-odds.yml/dispatches" \
              -d '{"ref":"main"}'
          else
            echo "Collector heartbeat healthy; no dispatch needed."
          fi
