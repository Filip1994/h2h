name: Temporary pytest diagnostic

on:
  push:
    branches: [refactor/system-stabilization-v1]

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - run: pytest > pytest_diagnostic.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pytest_diagnostic.txt
          git commit -m "chore: pytest diagnostic output" || exit 0
          git push
