name: QuantBet intraday strong-signal scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 6-23 * * *"
      timezone: "Europe/Belgrade"

permissions:
  contents: write

concurrency:
  group: quantbet-ledger
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      PAPER_MODE: ${{ vars.PAPER_MODE || 'true' }}
      H2H_TELEMETRY_ENABLED: ${{ vars.H2H_TELEMETRY_ENABLED || 'false' }}
      API_REQUEST_BUDGET: ${{ vars.API_REQUEST_BUDGET || '7500' }}
      API_BUDGET_RESERVE: ${{ vars.API_BUDGET_RESERVE || '500' }}
      INTRADAY_MODE: "true"
      INTRADAY_LOOKAHEAD_HOURS: "6"
      INTRADAY_ALERT_ENABLED: "true"
      STRONG_SIGNAL_MIN_EV: "0.10"
      STRONG_SIGNAL_MIN_EDGE_PP: "0.05"
      STRONG_SIGNAL_MIN_STAKE_RSD: "300"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/api
          key: api-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: api-cache-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - run: python main.py generate
      - run: python tools/decision_audit.py
      - name: Commit intraday ledger changes
        id: ledger
        run: |
          if git diff --quiet -- bets.json predictions.json ledger_meta.json api_usage.json api_usage_history.json audit/decision_audit.jsonl; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bets.json predictions.json ledger_meta.json api_usage.json api_usage_history.json audit/decision_audit.jsonl
          git commit -m "Update QuantBet intraday ledger"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Refresh GitHub Pages
        if: steps.ledger.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"
