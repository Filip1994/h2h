name: QuantBet legacy intraday producer (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quantbet-football-api-global
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      PAPER_MODE: ${{ vars.PAPER_MODE || 'true' }}
      API_REQUEST_BUDGET: ${{ vars.API_REQUEST_BUDGET || '7500' }}
      API_BUDGET_RESERVE: ${{ vars.API_BUDGET_RESERVE || '500' }}
      INTRADAY_MODE: "true"
      INTRADAY_LOOKAHEAD_HOURS: "6"
      INTRADAY_ALERT_ENABLED: "false"
      STRONG_SIGNAL_MIN_EV: "0.10"
      STRONG_SIGNAL_MIN_EDGE_PP: "0.05"
      STRONG_SIGNAL_MIN_STAKE_RSD: "300"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/api
          key: api-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: api-cache-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - name: Explicitly identify legacy path
        run: |
          echo "This workflow is manual-only and is not a canonical Strong/Near producer."
          echo "Canonical scheduled producer: .github/workflows/watchlist.yml"
      - name: Generate intraday signals for controlled manual diagnostics
        id: scan
        continue-on-error: true
        run: python main.py generate
      - name: Persist intraday generation health
        if: always()
        run: python tools/intraday_health.py --run-status "${{ steps.scan.outcome == 'success' && 'success' || 'failure' }}"
      - name: Audit persisted decision funnel
        if: always() && steps.scan.outcome == 'success'
        run: python tools/funnel_audit.py
      - name: Commit manual diagnostic state
        if: always()
        run: |
          set -euo pipefail
          files=(bets.json predictions.json ledger_meta.json api_usage.json api_usage_history.json generation_health.json generation_health_history.json intraday_alerts.json intraday_watchlist_state.json intraday_health.json decision_funnel_audit.json data/football_api_quota.json)
          changed=0
          for file in "${files[@]}"; do
            if [ -e "$file" ] && ! git diff --quiet -- "$file"; then changed=1; fi
            if [ -e "$file" ] && git ls-files --error-unmatch "$file" >/dev/null 2>&1; then :; elif [ -e "$file" ]; then changed=1; fi
          done
          if git status --porcelain -- data/raw_api | grep -q .; then changed=1; fi
          if [ "$changed" -eq 0 ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --ignore-errors "${files[@]}"
          if [ -d data/raw_api ]; then
            while IFS= read -r -d '' archive; do git add -- "$archive"; done < <(find data/raw_api -type f -size -90M -print0)
          fi
          git commit -m "Update QuantBet manual intraday diagnostics"
          git fetch origin main
          if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
          git push
      - name: Fail manual diagnostic when generation fails
        if: steps.scan.outcome == 'failure'
        run: exit 1
