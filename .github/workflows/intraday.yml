name: QuantBet intraday strong-signal scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
      timezone: "Europe/Belgrade"

permissions:
  contents: write

concurrency:
  group: quantbet-football-api-global
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      PAPER_MODE: ${{ vars.PAPER_MODE || 'true' }}
      API_REQUEST_BUDGET: ${{ vars.API_REQUEST_BUDGET || '7500' }}
      API_BUDGET_RESERVE: ${{ vars.API_BUDGET_RESERVE || '500' }}
      INTRADAY_MODE: "true"
      INTRADAY_LOOKAHEAD_HOURS: "6"
      INTRADAY_ALERT_ENABLED: "false"
      STRONG_SIGNAL_MIN_EV: "0.10"
      STRONG_SIGNAL_MIN_EDGE_PP: "0.05"
      STRONG_SIGNAL_MIN_STAKE_RSD: "300"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/api
          key: api-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: api-cache-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - name: Generate intraday signals
        id: scan
        continue-on-error: true
        run: python main.py generate
      - name: Persist intraday generation health
        if: always()
        run: python tools/intraday_health.py --run-status "${{ steps.scan.outcome }}"
      - name: Commit intraday ledger, signals, quota, health and safe raw API archives
        if: always()
        run: |
          set -euo pipefail
          files=(bets.json predictions.json ledger_meta.json api_usage.json api_usage_history.json generation_health.json generation_health_history.json intraday_alerts.json intraday_watchlist_state.json intraday_health.json data/football_api_quota.json)
          changed=0
          for file in "${files[@]}"; do
            if [ -e "$file" ] && ! git diff --quiet -- "$file"; then changed=1; fi
            if [ -e "$file" ] && git ls-files --error-unmatch "$file" >/dev/null 2>&1; then :; elif [ -e "$file" ]; then changed=1; fi
          done
          if git status --porcelain -- data/raw_api | grep -q .; then changed=1; fi
          if [ "$changed" -eq 0 ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --ignore-errors "${files[@]}"
          if [ -d data/raw_api ]; then
            while IFS= read -r -d '' archive; do
              git add -- "$archive"
            done < <(find data/raw_api -type f -size -90M -print0)
            oversized="$(find data/raw_api -type f -size +90M -print -quit)"
            if [ -n "$oversized" ]; then
              echo "Skipping raw API archive(s) over 90 MiB to stay below GitHub's 100 MiB file limit: $oversized"
            fi
          fi
          git commit -m "Update QuantBet intraday ledger and generation health"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then break; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Ledger reconciliation conflict; intraday update failed." >&2
              exit 1
            fi
          done
          echo "Unable to push intraday update after 3 attempts" >&2
          exit 1
      - name: Fail when signal generation fails
        if: steps.scan.outcome == 'failure'
        run: exit 1
