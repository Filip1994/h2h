name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - name: Smoke-test main generation import chain
        run: python -c "import main; print('main.py import OK')"
      - name: Lint active Production code
        run: ruff check main.py src/quantbot/monitor.py tools/build_production_view.py
      - run: pytest
