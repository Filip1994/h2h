name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - name: Normalize formatting on repair branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/ci-syntax-v4'
        run: |
          ruff format .
          ruff check . --fix
          git checkout -- .github/workflows/tests.yml
          rm -f .github/workflows/apply-format-v4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git diff --cached --quiet || git commit -m "chore: apply repository formatting"
          git push
      - run: ruff format --check .
      - run: ruff check .
      - name: Forensic odds lifecycle audit
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/audit_odds_lifecycle.py --output /tmp/odds-lifecycle-audit.md
      - name: Forensic signal classification audit
        if: github.event_name == 'pull_request'
        run: python tools/audit_signal_classification.py > /tmp/signal-classification-audit.txt
      - name: Forensic exhaustive odds capture audit
        if: github.event_name == 'pull_request'
        run: python tools/audit_exhaustive_odds_capture.py > /tmp/exhaustive-odds-capture-audit.md
      - run: pytest
