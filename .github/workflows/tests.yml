name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - name: Smoke-test main generation import chain
        run: python -c "import main; print('main.py import OK')"
      - name: Lint active Production code
        run: ruff check main.py src/quantbot/monitor.py src/quantbot/observation_identity.py src/quantbot/odds_lifecycle.py src/quantbot/persistence.py src/quantbot/decision_packet.py tools/build_production_view.py
      - name: Run frozen Production/model tests
        run: >-
          pytest
          tests/test_api.py
          tests/test_dixon_coles.py
          tests/test_decision_packet.py
          tests/test_odds_lifecycle_recovery.py
          tests/test_canonical_closing_semantics.py
          tests/test_odds_lifecycle.py
          tests/test_observation_identity.py
