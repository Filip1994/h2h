name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - name: Smoke-test main generation import chain
        run: python -c "import main; print('main.py import OK')"
      - name: Lint active Production code
        run: ruff check main.py src/quantbot/monitor.py tools/build_production_view.py
      - name: Run frozen Production/model tests
        run: >-
          pytest
          tests/test_api.py
          tests/test_dixon_coles.py
          tests/test_decision_packet.py
          tests/test_odds_lifecycle_recovery.py
          tests/test_canonical_closing_semantics.py
      - name: Controlled Railway migration
        if: contains(github.event.head_commit.message, '[railway-backfill]') && github.event_name == 'push'
        env:
          RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.RAILWAY_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RAILWAY_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.RAILWAY_S3_REGION }}
          S3_ENDPOINT: ${{ secrets.RAILWAY_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.RAILWAY_S3_BUCKET }}
        run: |
          python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.10" "awscli==1.44.27"
          python tools/railway_backfill.py
