name: Apply format v4

on:
  push:
    branches: [fix/ci-syntax-v4]

jobs:
  format:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.6
      - name: Restore engine from main and remove obsolete block
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- src/quantbot/engine.py
          python - <<'PY'
          from pathlib import Path
          p = Path("src/quantbot/engine.py")
          s = p.read_text()
          old = '''        blocked_market_keys = self.bet_store.blocked_market_keys(existing_bets)\n        blocked_fixture_ids = {\n            fixture_id for fixture_id, market in blocked_market_keys if market is None\n        }\n'''
          if old not in s:
              raise SystemExit("obsolete fixture block not found")
          p.write_text(s.replace(old, ""))
          PY
      - run: ruff format .
      - run: ruff check . --fix
      - run: rm -f .github/workflows/apply-format-v4.yml
      - run: |
          git checkout -- .github/workflows/tests.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git diff --cached --quiet || git commit -m "chore: apply repository formatting"
          git push
