name: Deploy QuantBet dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - QuantBet intraday strong-signal scanner
      - QuantBet adaptive watchlist monitor
      - Monitor odds and settle ledgers
      - QuantBet T-5 closing odds capture
      - Daily QuantBet bulletin
      - QuantBet closing-day bulletin
      - Skip pending bet
    types: [completed]
  push:
    branches: [main]
    paths:
      - index.html
      - bets.json
      - ledger_meta.json
      - strong_signals.json
      - .github/workflows/pages.yml
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/configure-pages@v5
      - name: Build static artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html bets.json ledger_meta.json strong_signals.json _site/
          test -s _site/index.html
          test -s _site/bets.json
          test -s _site/ledger_meta.json
          test -s _site/strong_signals.json
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('bets.json','ledger_meta.json','strong_signals.json'):
              with (Path('_site')/name).open(encoding='utf-8') as f: data=json.load(f)
              print(name, 'records=', len(data) if isinstance(data,list) else 'object')
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4