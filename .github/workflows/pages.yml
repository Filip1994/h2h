name: Deploy QuantBet dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - QuantBet intraday strong-signal scanner
      - QuantBet adaptive watchlist monitor
      - QuantBet T-5 closing odds capture
      - QuantBet daily bulletin
      - QuantBet intraday monitor
      - QuantBet closing-day bulletin
      - QuantBet skip pending tip
    types: [completed]
  push:
    branches: [main]
    paths:
      - index.html
      - bets.json
      - ledger_meta.json
      - .github/workflows/pages.yml
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Build static artifact
        run: |
          mkdir -p _site
          cp index.html bets.json ledger_meta.json _site/
          test -s _site/index.html
          test -s _site/bets.json
          test -s _site/ledger_meta.json
          python - <<'PY'
          import json
          for name in ("bets.json", "ledger_meta.json"):
              with open(name, encoding="utf-8") as f:
                  json.load(f, parse_constant=lambda value: (_ for _ in ()).throw(ValueError(f"invalid JSON constant: {value}")))
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
