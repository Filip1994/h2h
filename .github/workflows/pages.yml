name: Deploy QuantBet Production dashboard

# Recovery publisher only. The Production odds workflow is the authoritative
# live publisher and deploys the Pages artifact in the same run after state is committed.
# This workflow remains available for manual recovery and periodic reconciliation.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows:
      - Production · daily picks
      - Production · settlement
      - Skip pending Production bet
    types: [completed]
  push:
    branches: [main]
    paths:
      - index.html
      - production_dashboard.json
      - production_quote_health.json
      - bets.json
      - ledger_meta.json
      - system_health.json
      - assets/qb-dashboard.css
      - tools/build_production_view.py
      - tools/audit_production_targets.py
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build Production view
        run: python tools/build_production_view.py
      - name: Reapply exact Production target health
        run: python tools/audit_production_targets.py
      - name: Build static Production site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp assets/qb-dashboard.css _site/assets/qb-dashboard.css
          cp production_dashboard.json _site/production_dashboard.json
          cp production_quote_health.json _site/production_quote_health.json
          cp bets.json _site/bets.json
          cp ledger_meta.json _site/ledger_meta.json
          [ -f system_health.json ] && cp system_health.json _site/system_health.json || true
          test -s _site/index.html
          test -s _site/production_dashboard.json
          test -s _site/production_quote_health.json
          test -s _site/bets.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - name: Deploy Production dashboard
        id: deployment
        uses: actions/deploy-pages@v4
