name: Deploy QuantBet dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - QuantBet intraday strong-signal scanner
      - QuantBet adaptive watchlist monitor
      - Monitor odds and settle ledgers
      - QuantBet T-5 closing odds capture
      - QuantBet CLV persistence
      - Daily QuantBet bulletin
      - QuantBet closing-day bulletin
      - Skip pending bet
    types: [completed]
  push:
    branches: [main]
    paths:
      - index.html
      - production.html
      - strong-signals.html
      - near-misses.html
      - history.html
      - assets/**
      - bets.json
      - ledger_meta.json
      - intraday_alerts.json
      - strong_signals.json
      - strong_signal_ledger.json
      - strong_signals_portfolio.json
      - near_misses.json
      - bulletin_health.json
      - odds_collection_state.json
      - generation_health.json
      - generation_health_history.json
      - intraday_health.json
      - system_health.json
      - deployment_meta.json
      - tools/build_public_signal_buckets.py
      - tools/validate_public_dashboard.py
      - tools/system_health.py
      - strong_signal_legacy_settlements.json
      - src/quantbot/strong_signal_bankroll.py
      - .github/workflows/pages.yml
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ always() }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Verify canonical system health
        run: python tools/system_health.py --stale-minutes 30
      - name: Build isolated public signal datasets
        run: python tools/build_public_signal_buckets.py
      - name: Validate full public dashboard data contract
        run: python tools/validate_public_dashboard.py
      - name: Validate isolated Strong Signal publication contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          signals = json.loads(Path('strong_signals.json').read_text(encoding='utf-8'))
          ledger = json.loads(Path('strong_signal_ledger.json').read_text(encoding='utf-8'))
          portfolio = json.loads(Path('strong_signals_portfolio.json').read_text(encoding='utf-8'))
          terminal = {'WIN', 'LOSS', 'VOID', 'REVIEW'}
          completed = [x for x in signals if x.get('virtual_settled') is True and str(x.get('status') or '').upper() in terminal]
          expected_profit = sum(float(x.get('virtual_profit') or 0.0) for x in completed)

          assert isinstance(signals, list) and len(signals) == len(ledger), (
              'Strong Signal public dataset and ledger diverged'
          )
          assert all(x.get('virtual_portfolio') == 'STRONG_SIGNALS_VIRTUAL' for x in signals)
          assert all(x.get('not_a_production_bet') is True for x in signals)
          assert all((x.get('virtual_settled') is True) == (str(x.get('status') or '').upper() in terminal) for x in signals)
          assert all(float(x.get('virtual_profit') or 0.0) == (float(x.get('profit') or 0.0) if x.get('virtual_settled') is True else 0.0) for x in signals)
          assert portfolio['production'] is False
          assert portfolio['initial_bank'] == 10000.0
          assert portfolio['current_bank'] == 10000.0 + expected_profit
          assert portfolio['total_profit'] == expected_profit
          assert portfolio['completed_count'] == len(completed)
          print('strong_signals records=', len(signals))
          print('strong_signal completed=', len(completed))
          print('strong_signal portfolio=', json.dumps(portfolio, sort_keys=True))
          PY
      - uses: actions/configure-pages@v5
      - name: Build static artifact
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name || '' }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets
          cp index.html production.html strong-signals.html near-misses.html history.html _site/
          cp assets/qb-dashboard.css assets/qb-dashboard.js assets/strong-signals.js _site/assets/
          cp bets.json ledger_meta.json system_health.json _site/
          for file in intraday_alerts.json strong_signal_ledger.json strong_signals.json strong_signals_portfolio.json near_misses.json bulletin_health.json odds_collection_state.json generation_health.json generation_health_history.json intraday_health.json; do
            [ -f "$file" ] && cp "$file" _site/ || true
          done
          test -s _site/index.html
          test -s _site/production.html
          test -s _site/strong-signals.html
          test -s _site/near-misses.html
          test -s _site/history.html
          test -s _site/assets/qb-dashboard.css
          test -s _site/assets/qb-dashboard.js
          test -s _site/assets/strong-signals.js
          test -s _site/bets.json
          test -s _site/ledger_meta.json
          test -s _site/system_health.json
          test -s _site/strong_signals_portfolio.json
          test -s _site/strong_signal_ledger.json
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          site = Path('_site')
          files = {}
          for name in ('bets.json', 'ledger_meta.json', 'system_health.json', 'bulletin_health.json', 'odds_collection_state.json', 'generation_health.json', 'intraday_health.json', 'strong_signal_ledger.json', 'strong_signals_portfolio.json'):
              path = site / name
              if path.exists():
                  raw = path.read_bytes()
                  files[name] = {'sha256': hashlib.sha256(raw).hexdigest(), 'bytes': len(raw)}
          deployment = {
              'schema_version': 1,
              'built_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'event_name': os.environ.get('EVENT_NAME', ''),
              'upstream_workflow_run': {
                  'name': os.environ.get('WORKFLOW_RUN_NAME', ''),
                  'id': os.environ.get('WORKFLOW_RUN_ID', ''),
                  'conclusion': os.environ.get('WORKFLOW_RUN_CONCLUSION', ''),
              },
              'files': files,
          }
          (site / 'deployment_meta.json').write_text(json.dumps(deployment, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(deployment, indent=2))
          for name in ('bets.json', 'ledger_meta.json', 'system_health.json', 'bulletin_health.json', 'odds_collection_state.json', 'generation_health.json', 'generation_health_history.json', 'intraday_health.json', 'strong_signal_ledger.json', 'strong_signals_portfolio.json'):
              path = site / name
              if not path.exists():
                  print(name, 'not present')
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              print(name, 'records=', len(data) if isinstance(data, list) else 'object')
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
