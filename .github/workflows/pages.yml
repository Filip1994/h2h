name: Deploy QuantBet Production dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Production · daily picks
      - Production · 72h odds lifecycle
      - Production · settlement
    types: [completed]
  push:
    branches: [main]
    paths:
      - index.html
      - production_dashboard.json
      - bets.json
      - ledger_meta.json
      - system_health.json
      - assets/qb-dashboard.css
      - assets/qb-dashboard.js
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ always() }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Build static Production site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp assets/qb-dashboard.css _site/assets/qb-dashboard.css
          cp production_dashboard.json _site/production_dashboard.json
          cp bets.json _site/bets.json
          cp ledger_meta.json _site/ledger_meta.json
          [ -f system_health.json ] && cp system_health.json _site/system_health.json || true
          test -s _site/index.html
          test -s _site/production_dashboard.json
          test -s _site/bets.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - name: Deploy Production dashboard
        id: deployment
        uses: actions/deploy-pages@v4
