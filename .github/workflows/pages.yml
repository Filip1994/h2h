name: Deploy QuantBet dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - bets.json
      - ledger_meta.json
      - .github/workflows/pages.yml
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - name: Build static artifact
        run: |
          mkdir -p _site
          cp index.html bets.json ledger_meta.json _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
