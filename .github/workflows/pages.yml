name: Deploy QuantBet dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - QuantBet intraday strong-signal scanner
      - QuantBet adaptive watchlist monitor
      - Monitor odds and settle ledgers
      - QuantBet T-5 closing odds capture
      - Daily QuantBet bulletin
      - QuantBet closing-day bulletin
      - Skip pending bet
    types: [completed]
  push:
    branches: [main]
    paths:
      - index.html
      - bets.json
      - ledger_meta.json
      - .github/workflows/pages.yml
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  PAGES_ARTIFACT_RETENTION_DAYS: 1

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/configure-pages@v5
      - name: Build static artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html bets.json ledger_meta.json _site/
          test -s _site/index.html
          test -s _site/bets.json
          test -s _site/ledger_meta.json
          python - <<'PY'
          import json
          from pathlib import Path
          bets=json.loads(Path('bets.json').read_text(encoding='utf-8'))
          meta=json.loads(Path('ledger_meta.json').read_text(encoding='utf-8'))
          Path('_site/data.js').write_text('window.QUANTBET_DATA='+json.dumps({'bets':bets,'meta':meta},ensure_ascii=False,separators=(',',':'))+';',encoding='utf-8')
          for name in ('bets.json','ledger_meta.json'):
              path=Path('_site')/name
              with path.open(encoding='utf-8') as f:
                  data=json.load(f,parse_constant=lambda value: (_ for _ in ()).throw(ValueError(f'invalid JSON constant: {value}')))
              print(f'validated {name}: {path.stat().st_size} bytes')
              if name=='bets.json': print(f'ledger records: {len(data)}')
          print(f'embedded data: {Path("_site/data.js").stat().st_size} bytes')
          PY
          test -s _site/data.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
