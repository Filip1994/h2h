name: Railway · backfill trigger

on:
  push:
    branches: [main]
    paths:
      - BACKFILL_TRIGGER_NOTE_2.md

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RAILWAY_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RAILWAY_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.RAILWAY_S3_REGION }}
      S3_ENDPOINT: ${{ secrets.RAILWAY_S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.RAILWAY_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate storage secrets
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"; test -n "$AWS_SECRET_ACCESS_KEY"; test -n "$AWS_DEFAULT_REGION"; test -n "$S3_ENDPOINT"; test -n "$S3_BUCKET"
      - name: Install AWS CLI
        run: python -m pip install --disable-pip-version-check awscli
      - name: Backfill and verify raw API archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(data/raw_api/*.jsonl)
          test "${#files[@]}" -gt 0
          for src in "${files[@]}"; do
            base="$(basename "$src" .jsonl)"; key="quantumbet/raw-api/${base}.jsonl.gz"; sha="$(sha256sum "$src" | awk '{print $1}')"
            if aws s3api head-object --bucket "$S3_BUCKET" --key "$key" --endpoint-url "$S3_ENDPOINT" --region "$AWS_DEFAULT_REGION" >/tmp/head.json 2>/dev/null; then
              existing="$(python -c "import json; print(json.load(open('/tmp/head.json')).get('Metadata',{}).get('sha256',''))")"
              test "$existing" = "$sha" || { echo "Checksum mismatch: $key"; exit 1; }; echo "Already migrated: $src"; continue
            fi
            gzip -c "$src" > "/tmp/${base}.jsonl.gz"
            aws s3 cp "/tmp/${base}.jsonl.gz" "s3://${S3_BUCKET}/${key}" --endpoint-url "$S3_ENDPOINT" --region "$AWS_DEFAULT_REGION" --metadata "sha256=${sha}" --no-progress
            rm -f "/tmp/${base}.jsonl.gz"
          done
          for src in "${files[@]}"; do
            base="$(basename "$src" .jsonl)"; key="quantumbet/raw-api/${base}.jsonl.gz"; sha="$(sha256sum "$src" | awk '{print $1}')"
            aws s3api head-object --bucket "$S3_BUCKET" --key "$key" --endpoint-url "$S3_ENDPOINT" --region "$AWS_DEFAULT_REGION" >/tmp/head.json
            existing="$(python -c "import json; print(json.load(open('/tmp/head.json')).get('Metadata',{}).get('sha256',''))")"
            test "$existing" = "$sha"; echo "PASS $src -> $key"
          done
          echo 'Historical raw API backfill: PASS'
