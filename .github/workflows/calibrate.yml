name: Weekly probability calibration

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * 0"

permissions:
  contents: write

concurrency:
  group: quantbet-ledger
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py calibrate
      - name: Commit calibration
        run: |
          if git diff --quiet -- calibration.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calibration.json
          git commit -m "Update QuantBet calibration"
          git push
