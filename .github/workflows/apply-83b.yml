name: Finish decision funnel telemetry
on:
  push:
    branches: [fix/83-decision-funnel-telemetry]

jobs:
  patch:
    if: github.actor == 'Filip1994'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/quantbot/engine.py'); s=p.read_text()
          s=s.replace('                    if "dovoljan trening" in str(exc):\n                        telemetry["training_sample_insufficiency"] += 1\n                    else:\n                        telemetry["fit_failures"] += 1\n', '                    if "dovoljan trening" in str(exc):\n                        telemetry["training_sample_insufficiency"] += 1\n                        telemetry["funnel_rejections"].append({"fixture_id": fixture_id, "stage": "modelled", "reason": "NO_TRAINING_SAMPLE"})\n                    else:\n                        telemetry["fit_failures"] += 1\n                        telemetry["funnel_rejections"].append({"fixture_id": fixture_id, "stage": "modelled", "reason": "MODEL_FIT_FAILURE"})\n', 1)
          s=s.replace('                if isinstance(exc, APIError):\n                    telemetry["fixture_failures"]["api"] += 1\n', '                if isinstance(exc, APIError):\n                    telemetry["fixture_failures"]["api"] += 1\n                    telemetry["funnel_rejections"].append({"fixture_id": fixture_id, "stage": "modelled", "reason": "API_ERROR"})\n', 1)
          marker='        allocations = allocate_stakes(\n            candidates, existing_bets, now=now_local, settings=self.settings\n        )\n'
          repl=marker+'        telemetry["risk_checks"] = len(candidates)\n        allocated_before_strength = {\n            f"{candidate.fixture_id}_{candidate.market.value}_{MODEL_VERSION}" for candidate, _ in allocations\n        }\n        for candidate in candidates:\n            key = f"{candidate.fixture_id}_{candidate.market.value}_{MODEL_VERSION}"\n            if key not in allocated_before_strength:\n                telemetry["risk_rejections"] += 1\n                telemetry["funnel_rejections"].append({"fixture_id": candidate.fixture_id, "market": candidate.market.value, "stage": "risk_staking", "reason": "RISK_OR_CAPACITY"})\n'
          if marker not in s: raise SystemExit('allocation marker missing')
          s=s.replace(marker,repl,1)
          p.write_text(s)
          PY
          rm -f .github/workflows/apply-83b.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/quantbot/engine.py .github/workflows/apply-83b.yml
          git commit -m 'feat: classify risk constrained Production candidates'
          git push
