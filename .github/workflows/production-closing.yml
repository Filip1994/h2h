name: Production · T-15 closing capture

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - '.github/workflows/production-closing.yml'
      - 'tools/capture_production_closing.py'
      - 'src/quantbot/odds_lifecycle.py'

permissions:
  contents: write

concurrency:
  group: quantbet-production-closing
  cancel-in-progress: false

env:
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  PAPER_MODE: ${{ vars.PAPER_MODE || 'true' }}
  API_REQUEST_BUDGET: '7500'
  API_BUDGET_RESERVE: '0'
  TIMEZONE: UTC

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capture exact Production bookmaker quote at T-15
        run: python tools/capture_production_closing.py
      - name: Rebuild Production lifecycle view
        run: python tools/build_production_view.py
      - name: Commit T-15 closing observations
        run: |
          set -euo pipefail
          files=(bets.json production_dashboard.json data/odds_snapshots.jsonl)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --ignore-errors "${files[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture Production T-15 closing odds"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
