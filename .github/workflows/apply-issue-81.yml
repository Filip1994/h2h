name: Apply issue 81 engine patch

on:
  push:
    branches: [fix/81-83-production-selection-funnel]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Remove fixture-level top-1 candidate restriction
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/quantbot/engine.py')
          s = p.read_text()
          old = '''            if fixture_candidates:\n                telemetry["candidates_qualified"] += len(fixture_candidates)\n                telemetry["candidates"] += 1\n                candidates.append(\n                    max(\n                        fixture_candidates,\n                        key=lambda item: (item.expected_value, item.probability_edge),\n                    )\n                )\n'''
          new = '''            if fixture_candidates:\n                telemetry["candidates_qualified"] += len(fixture_candidates)\n                telemetry["candidates"] += len(fixture_candidates)\n                candidates.extend(fixture_candidates)\n'''
          if old not in s:
              raise SystemExit('expected engine block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove patch workflow
        run: rm .github/workflows/apply-issue-81.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/quantbot/engine.py .github/workflows/apply-issue-81.yml
          git commit -m 'Remove hidden fixture-level top-1 Production constraint'
          git push
