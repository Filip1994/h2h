name: Monitor odds and settle ledgers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor.yml"
      - "tools/system_health.py"
  schedule:
    - cron: "2/5 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: quantbet-football-api-global
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/api
          key: api-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: api-cache-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - run: python main.py monitor
      - run: python tools/settle_alerts.py
      - name: Check canonical system and settlement health
        id: settlement-health
        continue-on-error: true
        run: |
          set -euo pipefail
          python tools/system_health.py --stale-minutes 30
          python tools/settlement_health.py --max-age-minutes 30
      - name: Build isolated public Strong Signal dataset
        run: python tools/build_public_signal_buckets.py
      - name: Resolve Strong Signal Opening-Pick-Closing lifecycle
        run: python tools/enrich_public_strong_signal_lifecycle.py
      - name: Commit ledger, health report, isolated Strong Signals and raw API archive
        if: always()
        run: |
          set -euo pipefail
          files=(bets.json predictions.json intraday_alerts.json strong_signal_ledger.json strong_signals.json strong_signals_portfolio.json near_misses.json settlement_health.json system_health.json)
          if git diff --quiet -- "${files[@]}" && test -z "$(git status --porcelain -- data/raw_api)"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}" data/raw_api
          git commit -m "Settle QuantBet ledger and publish canonical health"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            if git rebase origin/main; then
              continue
            fi
            git rebase --abort || true
            echo "Ledger reconciliation conflict; settlement update failed." >&2
            exit 1
          done
          echo "Unable to push after retries" >&2
          exit 1
      - name: Fail when canonical settlement health is unsafe
        if: steps.settlement-health.outcome == 'failure'
        run: exit 1
