name: Monitor odds and settle ledgers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: quantbet-ledger
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/api
          key: api-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: api-cache-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - run: python main.py monitor
      - run: python tools/settle_alerts.py
      - name: Check settlement health
        id: settlement-health
        continue-on-error: true
        run: python tools/settlement_health.py --max-age-minutes 30
      - name: Build isolated public Strong Signal dataset
        run: python tools/build_public_signal_buckets.py
      - name: Commit ledger, health report, isolated Strong Signals and raw API archive
        if: always()
        run: |
          set -euo pipefail
          files=(bets.json predictions.json intraday_alerts.json strong_signal_ledger.json strong_signals.json strong_signals_portfolio.json near_misses.json settlement_health.json)
          if git diff --quiet -- "${files[@]}" && test -z "$(git status --porcelain -- data/raw_api)"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}" data/raw_api
          git commit -m "Settle QuantBet ledger and archive API data"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 2; }
          done
          echo "Unable to push after retries" >&2
          exit 1
      - name: Fail when settlement is stale
        if: steps.settlement-health.outcome == 'failure'
        run: exit 1

  strong-signal-watchlist:
    name: Scheduled Strong Signal watchlist
    needs: monitor
    if: ${{ always() }}
    runs-on: ubuntu-latest
    concurrency:
      group: quantbet-strong-signal-scheduled
      cancel-in-progress: false
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      PAPER_MODE: ${{ vars.PAPER_MODE || 'true' }}
      API_REQUEST_BUDGET: ${{ vars.API_REQUEST_BUDGET || '7500' }}
      API_BUDGET_RESERVE: ${{ vars.API_BUDGET_RESERVE || '500' }}
      INTRADAY_LOOKAHEAD_HOURS: "6"
      INTRADAY_ALERT_ENABLED: "true"
      STRONG_SIGNAL_MIN_EV: "0.10"
      STRONG_SIGNAL_MIN_EDGE_PP: "0.05"
      STRONG_SIGNAL_MIN_STAKE_RSD: "300"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/api
          key: api-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: api-cache-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - run: python main.py watchlist
      - name: Build isolated public Strong and Near Miss datasets
        run: python tools/build_public_signal_buckets.py
      - name: Validate scheduled Strong Signal publication contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          signals = json.loads(Path('strong_signals.json').read_text(encoding='utf-8'))
          portfolio = json.loads(Path('strong_signals_portfolio.json').read_text(encoding='utf-8'))
          assert all(x.get('virtual_portfolio') == 'STRONG_SIGNALS_VIRTUAL' for x in signals)
          assert all(x.get('not_a_production_bet') is True for x in signals)
          assert all(x.get('virtual_settled') is False for x in signals)
          assert all(float(x.get('virtual_profit') or 0.0) == 0.0 for x in signals)
          assert portfolio['production'] is False
          assert portfolio['initial_bank'] == 10000.0
          assert portfolio['current_bank'] == 10000.0
          assert portfolio['total_profit'] == 0.0
          assert portfolio['completed_count'] == 0
          print('scheduled Strong Signal records=', len(signals))
          print('scheduled Strong Signal portfolio=', json.dumps(portfolio, sort_keys=True))
          PY
      - name: Commit scheduled Strong Signal lifecycle evidence
        run: |
          set -euo pipefail
          files=(intraday_watchlist_state.json intraday_alerts.json strong_signal_ledger.json strong_signals.json strong_signals_portfolio.json near_misses.json market_timing_metrics.json)
          changed=0
          for file in "${files[@]}"; do
            if [ -e "$file" ] && ! git diff --quiet -- "$file"; then changed=1; fi
            if [ -e "$file" ] && git ls-files --error-unmatch "$file" >/dev/null 2>&1; then :; elif [ -e "$file" ]; then changed=1; fi
          done
          if git status --porcelain -- data/market_timing_snapshots.jsonl data/intraday_signal_events.jsonl data/raw_api | grep -q .; then changed=1; fi
          if [ "$changed" -eq 0 ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}" data/market_timing_snapshots.jsonl data/intraday_signal_events.jsonl
          while IFS= read -r file; do git add "$file"; done < <(find data/raw_api -type f -size -90M -print)
          git commit -m "Update QuantBet signal classification observations"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Signal lifecycle reconciliation conflict; update failed." >&2
              exit 1
            fi
          done
          echo "Unable to push after retries" >&2
          exit 1
