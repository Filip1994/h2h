name: Monitor odds and settle ledgers

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: quantbet-ledger
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/api
          key: api-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: api-cache-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - run: python main.py monitor
      - run: python tools/settle_alerts.py
      - name: Commit ledger and raw API archive
        run: |
          if git diff --quiet -- bets.json predictions.json intraday_alerts.json && test -z "$(git status --porcelain -- data/raw_api)"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bets.json predictions.json intraday_alerts.json data/raw_api
          git commit -m "Settle QuantBet ledger and archive API data"
          git push
