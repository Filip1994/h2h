name: Normalize current Python formatting
on:
  push:
    branches: [fix/ci-formatting-v2]

jobs:
  format:
    if: github.actor == 'Filip1994'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff format .
      - run: ruff check . --fix
      - run: rm -f .github/workflows/apply-format-v2.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m 'chore: normalize Python formatting' || exit 0
          git push
