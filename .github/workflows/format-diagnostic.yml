name: Temporary formatter diagnostic

on:
  push:
    branches: [refactor/system-stabilization-v1]

permissions:
  contents: write

jobs:
  diagnostic:
    if: github.sha != '4dae705c44b62567a39ff0c26c54c9e67a9be589'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff format --diff . > format_diff.txt || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add format_diff.txt
          git commit -m "chore: formatter diagnostic output" || exit 0
          git push
