name: Temporary dashboard cache patch
on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.actor == 'Filip1994'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version dashboard assets and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          version = '20260909-2'
          for name in ('index.html','production.html','strong-signals.html','near-misses.html','history.html'):
              p = Path(name)
              s = p.read_text()
              s = s.replace('src="./assets/qb-dashboard.js"', f'src="./assets/qb-dashboard.js?v={version}"')
              p.write_text(s)
          Path('.github/workflows/patch-dashboard-cache.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html production.html strong-signals.html near-misses.html history.html .github/workflows/patch-dashboard-cache.yml
          git commit -m 'fix: bust dashboard asset cache after renderer fix'
          git push
