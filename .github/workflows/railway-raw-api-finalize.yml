name: Railway · finalize raw API archive

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RAILWAY_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RAILWAY_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.RAILWAY_S3_REGION }}
      S3_ENDPOINT: ${{ secrets.RAILWAY_S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.RAILWAY_S3_BUCKET }}
    steps:
      - name: Validate Railway Bucket configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$AWS_DEFAULT_REGION"
          test -n "$S3_ENDPOINT"
          test -n "$S3_BUCKET"

      - name: Finalize previous UTC day
        shell: bash
        run: |
          set -euo pipefail
          day="$(date -u -d 'yesterday' +%F)"
          live="quantumbet/raw-api/live/${day}.jsonl.gz"
          archive="quantumbet/raw-api/archive/${day}.jsonl.gz"

          aws s3api head-object \
            --bucket "$S3_BUCKET" \
            --key "$live" \
            --endpoint-url "$S3_ENDPOINT" \
            --region "$AWS_DEFAULT_REGION" >/tmp/live.json

          live_sha="$(python - <<'PY'
import json
print(json.load(open('/tmp/live.json')).get('Metadata', {}).get('sha256', ''))
PY
)"
          test -n "$live_sha"

          if aws s3api head-object \
            --bucket "$S3_BUCKET" \
            --key "$archive" \
            --endpoint-url "$S3_ENDPOINT" \
            --region "$AWS_DEFAULT_REGION" >/tmp/archive.json 2>/dev/null; then
            archive_sha="$(python - <<'PY'
import json
print(json.load(open('/tmp/archive.json')).get('Metadata', {}).get('sha256', ''))
PY
)"
            test "$archive_sha" = "$live_sha"
            echo "Archive already finalized and checksum matches: $day"
            exit 0
          fi

          aws s3 cp "s3://${S3_BUCKET}/${live}" "s3://${S3_BUCKET}/${archive}" \
            --endpoint-url "$S3_ENDPOINT" \
            --region "$AWS_DEFAULT_REGION" \
            --metadata-directive COPY \
            --no-progress

          aws s3api head-object \
            --bucket "$S3_BUCKET" \
            --key "$archive" \
            --endpoint-url "$S3_ENDPOINT" \
            --region "$AWS_DEFAULT_REGION" >/tmp/archive.json

          archive_sha="$(python - <<'PY'
import json
print(json.load(open('/tmp/archive.json')).get('Metadata', {}).get('sha256', ''))
PY
)"
          test "$archive_sha" = "$live_sha"
          echo "Raw API archive finalization: PASS ($day)"
