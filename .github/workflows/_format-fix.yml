name: Temporary Ruff format fix

on:
  push:
    branches:
      - fix/ci-format-main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.6
      - run: ruff format main.py src/quantbot/alerts.py src/quantbot/closing.py src/quantbot/engine.py src/quantbot/watchlist.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git add main.py src/quantbot/alerts.py src/quantbot/closing.py src/quantbot/engine.py src/quantbot/watchlist.py
          git commit -m "style: format intraday monitoring code"
          git push
