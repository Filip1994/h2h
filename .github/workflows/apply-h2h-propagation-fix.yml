name: Apply H2H propagation fix

on:
  push:
    branches: [fix/h2h-enabled-propagation]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch runtime propagation and regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path("src/quantbot/engine.py")
          text = engine.read_text()
          old = '''                        decision_probability=decision_probability,\n                        h2h_rate=h2h_rates[market],'''
          new = '''                        decision_probability=decision_probability,\n                        h2h_rate=h2h_rates[market],'''
          # The runtime flag must be passed explicitly; insert immediately before h2h_rate.
          target = '''                        decision_probability=decision_probability,\n                        h2h_rate=h2h_rates[market],'''
          replacement = '''                        decision_probability=decision_probability,\n                        h2h_rate=h2h_rates[market],\n                        h2h_enabled=self.settings.h2h_telemetry_enabled,'''
          if text.count(target) != 1:
              raise SystemExit(f"engine target count={text.count(target)}")
          engine.write_text(text.replace(target, replacement))

          test = Path("tests/test_h2h_engine_regression.py")
          text = test.read_text()
          target = '''    assert [\n        (b["market"], b["stake"], b["expected_value"], b["probability_edge"])\n        for b in off_result.new_bets\n    ] == [\n        (b["market"], b["stake"], b["expected_value"], b["probability_edge"])\n        for b in on_result.new_bets\n    ]\n'''
          replacement = target + '''    assert off_result.new_bets[0]["h2h_enabled"] is False\n    assert on_result.new_bets[0]["h2h_enabled"] is True\n'''
          if text.count(target) != 1:
              raise SystemExit(f"test target count={text.count(target)}")
          test.write_text(text.replace(target, replacement))
          PY

      - name: Run focused regression tests
        run: |
          python -m pip install -r requirements-dev.txt
          pytest -q tests/test_h2h_engine_regression.py
          ruff check src tests
          ruff format --check src tests

      - name: Commit fix and remove one-shot runner
        run: |
          rm .github/workflows/apply-h2h-propagation-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/quantbot/engine.py tests/test_h2h_engine_regression.py .github/workflows/apply-h2h-propagation-fix.yml
          git commit -m "fix: propagate H2H telemetry enabled flag"
          git push origin HEAD:fix/h2h-enabled-propagation
