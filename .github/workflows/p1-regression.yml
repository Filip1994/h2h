name: P1 decision regression
on:
  push:
    branches: [p1/h2h-removal-final3]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: p1/h2h-removal-final3}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Compare identical fixture/model/odds decision
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/base origin/main
          python - <<'PY'
          import json, os, subprocess, tempfile
          from pathlib import Path
          script = r'''
          import json, tempfile
          from datetime import UTC, datetime, timedelta
          from pathlib import Path
          from quantbot.config import Settings
          from quantbot.engine import QuantEngine
          ns={}
          exec(compile(Path('tests/test_engine_integration.py').read_text(), 'tests/test_engine_integration.py', 'exec'), ns)
          FakeAPI=ns['FakeAPI']
          with tempfile.TemporaryDirectory() as td:
              os.environ.update({'API_FOOTBALL_KEY':'test-key','TIMEZONE':'UTC','PAPER_MODE':'true','MIN_TRAINING_MATCHES':'20','MIN_TEAM_MATCHES':'2','MIN_CALIBRATION_SAMPLES':'10','PROBABILITY_HAIRCUT':'0','MIN_EDGE_PP':'0','MIN_EV':'0'})
              settings=Settings.from_env(Path(td))
              now=datetime(2026,9,4,6,0,tzinfo=UTC)
              result=QuantEngine(settings,api=FakeAPI(now)).generate(now)
              records=QuantEngine(settings,api=FakeAPI(now)).prediction_store.load()
              print(json.dumps({'new_bets':result.new_bets,'predictions':records},sort_keys=True,default=str))
          '''
          Path('/tmp/regression.py').write_text('import os\n'+script)
          def run(cwd):
              out=subprocess.check_output(['python','/tmp/regression.py'],cwd=cwd,text=True,env={**os.environ,'PYTHONPATH':str(Path(cwd)/'src')})
              return out.strip()
          base=run('/tmp/base')
          pr=run('.')
          Path('/tmp/base-output.json').write_text(base)
          Path('/tmp/pr-output.json').write_text(pr)
          if base != pr:
              print('BASE',base)
              print('PR',pr)
              raise SystemExit('DECISION REGRESSION FAILED')
          print('DECISION REGRESSION PASS: model probability, calibrated probability, decision output, EV/edge, market and stake are unchanged.')
          PY
