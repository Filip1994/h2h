name: Strong Signal provenance audit

on:
  workflow_run:
    workflows: ["QuantBet adaptive watchlist monitor"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: quantbet-football-api-global
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 200

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Identify exact scheduled-run public-data commit
        id: target
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          target=$(git log main -S"${SOURCE_RUN_ID}" --format='%H' -- watchlist_run_meta.json | head -n 1 || true)
          if [ -z "${target}" ]; then
            git fetch origin main --deepen=1000
            target=$(git log main -S"${SOURCE_RUN_ID}" --format='%H' -- watchlist_run_meta.json | head -n 1 || true)
          fi
          if [ -z "${target}" ]; then
            echo "No canonical watchlist commit contains scheduled source run ${SOURCE_RUN_ID}; refusing ambiguous provenance." >&2
            exit 1
          fi
          echo "sha=${target}" >> "$GITHUB_OUTPUT"
          echo "Strong Signal data commit: ${target}"

      - name: Checkout scheduled-run data commit
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: git checkout --detach "${TARGET_SHA}"

      - name: Reconcile Strong Signal generation and publication
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: python tools/reconcile_strong_signal_run.py

      - name: Verify generated public contract
        run: |
          python tools/validate_public_dashboard.py
          python -m json.tool strong_signal_run_evidence.json >/dev/null

      - name: Preserve generated evidence before switching to canonical main
        run: cp strong_signal_run_evidence.json /tmp/strong_signal_run_evidence.json

      - name: Check canonical evidence ordering and idempotence
        id: publish-check
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git cat-file -e "origin/main:strong_signal_run_evidence.json" 2>/dev/null; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show origin/main:strong_signal_run_evidence.json > /tmp/current-strong-signal-evidence.json
          python - <<'PY'
          import os
          from pathlib import Path

          from tools.provenance_publish_guard import assert_publishable, source_run_id

          current_path = Path("/tmp/current-strong-signal-evidence.json")
          source_run = os.environ["SOURCE_RUN_ID"]
          current = __import__("json").loads(current_path.read_text(encoding="utf-8"))
          current_run = source_run_id(current)
          if current_run is None:
              raise SystemExit("Canonical Strong Signal evidence has malformed source_run")
          assert_publishable(source_run, current_path)
          if current_run == int(source_run):
              print(f"Strong Signal evidence for source run {source_run} already published; idempotent no-op.")
              Path("/tmp/publish-skip").write_text("true", encoding="utf-8")
          PY
          if [ -e /tmp/publish-skip ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publish machine-readable evidence
        if: steps.publish-check.outputs.skip != 'true'
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          PUBLICATION_RUN_ID: ${{ github.run_id }}
          PUBLICATION_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          path = Path("/tmp/strong_signal_run_evidence.json")
          evidence = json.loads(path.read_text(encoding="utf-8"))
          evidence["publication"] = {
              "workflow": "Strong Signal provenance audit",
              "run_id": str(os.environ["PUBLICATION_RUN_ID"]),
              "run_attempt": int(os.environ["PUBLICATION_ATTEMPT"]),
              "published_at": datetime.now(UTC).isoformat(),
          }
          path.write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout --detach origin/main
          python tools/provenance_publish_guard.py check \
            --source-run "${SOURCE_RUN_ID}" \
            --current-path strong_signal_run_evidence.json
          cp /tmp/strong_signal_run_evidence.json strong_signal_run_evidence.json
          git add strong_signal_run_evidence.json
          if git diff --cached --quiet; then
            echo "Strong Signal evidence unchanged."
            exit 0
          fi
          git commit -m "chore: persist Strong Signal run evidence"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if git cat-file -e "origin/main:strong_signal_run_evidence.json" 2>/dev/null; then
              git show origin/main:strong_signal_run_evidence.json > /tmp/current-strong-signal-evidence.json
              python tools/provenance_publish_guard.py check \
                --source-run "${SOURCE_RUN_ID}" \
                --current-path /tmp/current-strong-signal-evidence.json
            fi
            git rebase origin/main
          done
          echo "Unable to publish Strong Signal evidence after retries" >&2
          exit 1

      - name: Report reconciliation
        run: cat /tmp/strong_signal_run_evidence.json
