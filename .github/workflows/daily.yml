name: Daily QuantBet bulletin

on:
  workflow_dispatch:
  schedule:
    - cron: "51 0 * * *"
      timezone: "Europe/Belgrade"

permissions:
  actions: write
  contents: write

concurrency:
  group: quantbet-ledger
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      PAPER_MODE: ${{ vars.PAPER_MODE || 'true' }}
      H2H_TELEMETRY_ENABLED: "true"
      API_REQUEST_BUDGET: ${{ vars.API_REQUEST_BUDGET || '7500' }}
      API_BUDGET_RESERVE: ${{ vars.API_BUDGET_RESERVE || '500' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/api
          key: api-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: api-cache-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - run: python main.py generate --no-email
      - name: Commit ledger and raw API archive
        run: |
          if git diff --quiet -- bets.json predictions.json calibration.json ledger_meta.json api_usage.json api_usage_history.json && test -z "$(git status --porcelain -- data/raw_api)"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bets.json predictions.json calibration.json ledger_meta.json api_usage.json api_usage_history.json data/raw_api
          git commit -m "Update QuantBet daily ledger and API archive"
          git push
      - name: Send committed bulletin
        run: python main.py send-report
