name: Daily QuantBet bulletin

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: quantbet-ledger
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      PAPER_MODE: ${{ vars.PAPER_MODE || 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/api
          key: api-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: api-cache-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - run: python main.py generate --no-email
      - name: Commit ledger changes
        id: ledger
        run: |
          if git diff --quiet -- bets.json predictions.json calibration.json ledger_meta.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bets.json predictions.json calibration.json ledger_meta.json
          git commit -m "Update QuantBet daily ledger"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Send committed bulletin
        run: python main.py send-report
      - name: Refresh GitHub Pages
        if: always() && steps.ledger.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"
