name: Daily QuantBet bulletin

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force a new bulletin even if today's bulletin is already marked SUCCESS"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/30 * * * *"
      timezone: "Europe/Belgrade"
  workflow_run:
    workflows:
      - QuantBet intraday strong-signal scanner
    types: [completed]

# The generation job mutates the shared ledger and may call Football API.
# Serialize it with every other Football API workflow; the application-level
# quota governor remains the final per-request guard inside the process.

jobs:
  generate:
    concurrency:
      group: quantbet-football-api-global
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      PAPER_MODE: ${{ vars.PAPER_MODE || 'true' }}
      API_REQUEST_BUDGET: ${{ vars.API_REQUEST_BUDGET || '7500' }}
      API_BUDGET_RESERVE: ${{ vars.API_BUDGET_RESERVE || '500' }}
      FORCE_BULLETIN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Re-check today's bulletin health after acquiring global API lock
        id: gate
        run: |
          set -euo pipefail
          if [ "$FORCE_BULLETIN" = "true" ]; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
            echo "Forced bulletin run requested."
            exit 0
          fi
          if python tools/bulletin_health.py --guard; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
            echo "Today's bulletin is already complete; scheduled run is a no-op."
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
            echo "Today's bulletin is not complete; scheduled generation will proceed."
          fi
      - name: Install dependencies
        if: steps.gate.outputs.generate == 'true'
        run: pip install -r requirements.txt
      - name: Capture generation start
        if: steps.gate.outputs.generate == 'true'
        id: generation-start
        run: echo "timestamp=$(python -c 'from datetime import datetime,UTC; print(datetime.now(UTC).isoformat())')" >> "$GITHUB_OUTPUT"
      - name: Generate committed bulletin source
        if: steps.gate.outputs.generate == 'true'
        run: python main.py generate --no-email
      - name: Capture generation completion
        if: steps.gate.outputs.generate == 'true'
        id: generation-complete
        run: echo "timestamp=$(python -c 'from datetime import datetime,UTC; print(datetime.now(UTC).isoformat())')" >> "$GITHUB_OUTPUT"
      - name: Commit ledger, health and safe raw API archives
        if: steps.gate.outputs.generate == 'true'
        run: |
          set -euo pipefail
          files=(bets.json predictions.json calibration.json ledger_meta.json api_usage.json api_usage_history.json generation_health.json generation_health_history.json)
          changed=0
          for file in "${files[@]}"; do
            if [ -e "$file" ] && ! git diff --quiet -- "$file"; then changed=1; fi
            if [ -e "$file" ] && git ls-files --error-unmatch "$file" >/dev/null 2>&1; then :; elif [ -e "$file" ]; then changed=1; fi
          done
          if git status --porcelain -- data/raw_api | grep -q .; then changed=1; fi
          if [ "$changed" -eq 0 ]; then
            echo "No ledger, health or API archive changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --ignore-errors "${files[@]}"
            if [ -d data/raw_api ]; then
              while IFS= read -r -d '' archive; do
                git add -- "$archive"
              done < <(find data/raw_api -type f -size -90M -print0)
              oversized="$(find data/raw_api -type f -size +90M -print -quit)"
              if [ -n "$oversized" ]; then
                echo "Skipping raw API archive(s) over 90 MiB to stay below GitHub's 100 MiB file limit: $oversized"
              fi
            fi
            git commit -m "Update QuantBet daily ledger, health and API archive"
            for attempt in 1 2 3; do
              if git push; then
                git fetch origin main
                git merge-base --is-ancestor HEAD origin/main
                exit 0
              fi
              if [ "$attempt" -eq 3 ]; then
                break
              fi
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Ledger reconciliation conflict; bulletin will not be sent." >&2
                exit 1
              fi
            done
            echo "Unable to push reconciled ledger after 3 attempts; bulletin will not be sent." >&2
            exit 1
          fi
      - name: Send committed bulletin
        if: steps.gate.outputs.generate == 'true'
        run: python main.py send-report
      - name: Write canonical success marker
        if: steps.gate.outputs.generate == 'true'
        run: |
          python tools/bulletin_health.py --write-success \
            --generation-started-at "${{ steps.generation-start.outputs.timestamp }}" \
            --generation-completed-at "${{ steps.generation-complete.outputs.timestamp }}"
      - name: Commit bulletin health marker
        if: steps.gate.outputs.generate == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bulletin_health.json
          git commit -m "Mark daily QuantBet bulletin successful"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then break; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1
