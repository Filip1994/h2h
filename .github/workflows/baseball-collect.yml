name: Baseball data footprint

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 6-23 * * *"
      timezone: "Europe/Belgrade"

permissions:
  contents: write

concurrency:
  group: baseball-data-footprint
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      API_BASEBALL_KEY: ${{ secrets.API_BASEBALL_KEY }}
      API_BASEBALL_BASE_URL: https://v1.baseball.api-sports.io
      BASEBALL_API_REQUEST_BUDGET: "200"
      BASEBALL_API_MAX_ATTEMPTS: "3"
      BASEBALL_API_RETRY_BASE_SECONDS: "1"
      TIMEZONE: Europe/Belgrade
      PAPER_MODE: "true"
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: baseball

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - name: Validate API key presence
        run: test -n "$API_BASEBALL_KEY"

      - name: Collect Baseball snapshots and market coverage
        run: |
          python -c "from pathlib import Path; from quantbot.baseball.collector import collect_once; print(collect_once(Path('.'), max_odds_requests=199))"

      - name: Scan Baseball intraday paper signals
        run: |
          python -c "from pathlib import Path; from quantbot.baseball.signals import scan_once, send_alerts; from quantbot.baseball.config import BaseballSettings; root=Path('.'); print(scan_once(root)); print({'alerts_sent': send_alerts(root, BaseballSettings.from_env(root))})"

      - name: Commit Baseball data footprint
        run: |
          if git diff --quiet -- data/baseball baseball_intraday_signals.json; then
            echo "No new Baseball snapshot data"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/baseball baseball_intraday_signals.json
          git commit -m "Collect Baseball market snapshots"
          git push origin baseball
