name: Production · 72h odds lifecycle

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/production-odds.yml'
      - 'tools/force_production_due.py'
      - 'tools/audit_production_targets.py'
      - 'tools/capture_production_closing.py'
      - 'tools/apply_t15_closing_view.py'
      - 'tools/assert_production_odds_fresh.py'
      - 'src/quantbot/odds_lifecycle.py'
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  PAPER_MODE: ${{ vars.PAPER_MODE || 'true' }}
  API_REQUEST_BUDGET: '7500'
  API_BUDGET_RESERVE: '0'
  TIMEZONE: UTC

concurrency:
  group: quantbet-football-odds-collector
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/api
          key: production-odds-api-${{ runner.os }}-${{ github.run_id }}
          restore-keys: production-odds-api-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - name: Validate active Production picks
        run: python tools/validate_production_picks.py
      - name: Force active Production fixtures due
        run: python tools/force_production_due.py
      - name: Capture due fixtures in the next 72 hours
        run: python main.py capture-odds
      - name: Capture exact Production bookmaker quote at T-15
        run: python tools/capture_production_closing.py
      - name: Build Production lifecycle view
        run: python tools/build_production_view.py
      - name: Audit exact Production target quotes
        run: python tools/audit_production_targets.py
      - name: Materialize T-15 closing policy
        run: python tools/apply_t15_closing_view.py
      - name: Audit Production odds freshness (non-blocking)
        run: python tools/assert_production_odds_fresh.py
      - name: Archive raw API evidence to Railway Bucket
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RAILWAY_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RAILWAY_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.RAILWAY_S3_REGION }}
          S3_ENDPOINT: ${{ secrets.RAILWAY_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.RAILWAY_S3_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$AWS_DEFAULT_REGION"
          test -n "$S3_ENDPOINT"
          test -n "$S3_BUCKET"
          src="data/raw_api/$(date -u +%F).jsonl"
          if [ ! -f "$src" ]; then
            echo 'No raw API archive produced by this run'
            exit 0
          fi
          day="$(date -u +%F)"
          run_id="${GITHUB_RUN_ID}"
          base="$(basename "$src" .jsonl)"
          gzip -c "$src" > "/tmp/${base}-${run_id}.jsonl.gz"
          sha="$(sha256sum "$src" | awk '{print $1}')"
          aws s3 cp "/tmp/${base}-${run_id}.jsonl.gz" "s3://${S3_BUCKET}/quantumbet/raw-api/runs/${day}/${run_id}.jsonl.gz" \
            --endpoint-url "$S3_ENDPOINT" \
            --region "$AWS_DEFAULT_REGION" \
            --metadata "sha256=${sha}" \
            --no-progress
          rm -f "/tmp/${base}-${run_id}.jsonl.gz"
          echo "Raw API archive upload: PASS run=${run_id} sha256=${sha}"
      - name: Commit immutable Production observations
        id: commit_state
        run: |
          set -euo pipefail
          files=(bets.json odds_collection_budget.json odds_collection_state.json odds_collection_metrics.json production_operations_gate.md production_dashboard.json production_quote_health.json data/odds_snapshots.jsonl data/odds_collection_coverage.jsonl data/eligibility_coverage.jsonl data/football_api_quota.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --ignore-errors "${files[@]}"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Capture Production odds lifecycle"
          for attempt in 1 2 3; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
      - name: Build static Production site
        if: steps.commit_state.outputs.changed == 'true'
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp assets/qb-dashboard.css _site/assets/qb-dashboard.css
          cp production_dashboard.json _site/production_dashboard.json
          cp production_quote_health.json _site/production_quote_health.json
          cp bets.json _site/bets.json
          cp ledger_meta.json _site/ledger_meta.json
          [ -f system_health.json ] && cp system_health.json _site/system_health.json || true
          test -s _site/index.html
          test -s _site/production_dashboard.json
          test -s _site/production_quote_health.json
          test -s _site/bets.json
      - name: Configure GitHub Pages
        if: steps.commit_state.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Production Pages artifact
        if: steps.commit_state.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - name: Deploy Production dashboard
        if: steps.commit_state.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
